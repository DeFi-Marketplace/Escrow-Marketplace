version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: defi_marketplace
      POSTGRES_USER: defi_user
      POSTGRES_PASSWORD: defi_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U defi_user -d defi_marketplace']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://defi_user:defi_pass@postgres:5432/defi_marketplace
      STELLAR_RPC_URL: https://soroban-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
      PORT: '4000'
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/src:/app/src

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_STELLAR_RPC: https://soroban-testnet.stellar.org
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ../frontend/src:/app/src

volumes:
  pgdata:
